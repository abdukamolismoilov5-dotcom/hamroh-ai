<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="50%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D9F5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2F4FF"/>
      <stop offset="100%" stop-color="#38E1FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Side: Icon Emblem (Centered at X=250, Y=250) -->
  <g transform="translate(-10, 0)">
    <!-- Outer Shield Wings -->
    <path d="M 120, 140
             C 160, 125 210, 110 260, 110
             C 260, 110 260, 150 260, 150
             C 220, 150 170, 165 145, 180
             C 140, 255 160, 335 260, 410
             C 260, 410 260, 445 260, 445
             C 120, 355 105, 245 120, 140 Z"
          fill="url(#hGrad)"/>

    <path d="M 400, 140
             C 360, 125 310, 110 260, 110
             C 260, 110 260, 150 260, 150
             C 300, 150 350, 165 375, 180
             C 380, 255 360, 335 260, 410
             C 260, 410 260, 445 260, 445
             C 400, 355 415, 245 400, 140 Z"
          fill="url(#hGrad)"/>

    <!-- Inner Core -->
    <path d="M 260, 165
             C 300, 165 340, 178 355, 188
             C 360, 245 340, 305 260, 365
             C 180, 305 160, 245 165, 188
             C 180, 178 220, 165 260, 165 Z"
          fill="#070C1A" stroke="url(#hGrad)" stroke-width="4"/>

    <!-- Road -->
    <polygon points="260,230 205,355 225,355 260,250 295,355 315,355" fill="url(#hGrad)" fill-opacity="0.35"/>
    <line x1="260" y1="240" x2="260" y2="270" stroke="#00F5A0" stroke-width="4" stroke-linecap="round"/>
    <line x1="260" y1="290" x2="260" y2="330" stroke="#00F5A0" stroke-width="6" stroke-linecap="round"/>

    <!-- Eye Lens -->
    <circle cx="260" cy="230" r="26" fill="#070C1A" stroke="url(#emeraldGrad)" stroke-width="4"/>
    <circle cx="260" cy="230" r="14" fill="url(#emeraldGrad)"/>
    <circle cx="260" cy="230" r="6" fill="#FFFFFF"/>
    
    <!-- Diamond -->
    <polygon points="260,85 267,100 282,100 270,110 275,125 260,115 245,125 250,110 238,100 253,100" fill="#00F5A0"/>
  </g>

  <!-- Right Side: Brand Typography -->
  <g transform="translate(480, 0)">
    <!-- Wordmark "HAMROH" -->
    <text x="0" y="240" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="124" font-weight="800" fill="url(#textGrad)" letter-spacing="4">
      HAMROH
    </text>
    
    <!-- "AI" Badge Box -->
    <rect x="635" y="145" width="160" height="105" rx="24" ry="24" fill="url(#hGrad)"/>
    <text x="715" y="228" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-size="76" font-weight="900" fill="#060913" text-anchor="middle" letter-spacing="2">
      AI
    </text>

    <!-- Subtitle: Autonomous Driver Safety & Edge AI Copilot -->
    <text x="5" y="315" font-family="'Inter', sans-serif" font-size="34" font-weight="700" fill="#00F5A0" letter-spacing="10">
      EDGE-AI COPILOT
    </text>
    
    <text x="5" y="365" font-family="'Inter', sans-serif" font-size="24" font-weight="400" fill="#88A0C2" letter-spacing="3">
      AVTONOM HAYDOVCHI VA FAOL YO'L XAVFSIZLIGI
    </text>

    <!-- Accent separator line -->
    <line x1="5" y1="272" x2="790" y2="272" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="2"/>
  </g>
</svg>